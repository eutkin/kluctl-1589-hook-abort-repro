# Hook 1: висит дольше таймаута (sleep 3600) — таймаут ожидания = триггер аборта.
apiVersion: batch/v1
kind: Job
metadata:
  name: hook-hang
  namespace: kluctl-repro
  annotations:
    kluctl.io/hook: pre-deploy
    kluctl.io/hook-weight: "1"
    kluctl.io/hook-timeout: "15s"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: sleep
          image: registry.k8s.io/busybox:1.27.2
          command: ["sh", "-c", "sleep 3600"]
